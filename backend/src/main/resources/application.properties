spring.application.name=dementia-screen-backend

# Load the local backend environment file when Maven is run directly.
spring.config.import=optional:file:.env[.properties]

# ---- Database (Supabase PostgreSQL — SESSION POOLER; secrets via env, never hardcoded) ----
# All values come from the DB_* environment variables. The JDBC URL keeps sslmode=require
# (SSL is NOT disabled). For the Supabase SESSION POOLER the expected values are:
#   DB_HOST = <region>.pooler.supabase.com   (session pooler), port 5432
#   DB_USER = <db-user>.<PROJECT-REF>        (username MUST include the project-ref suffix)
#   DB_NAME = <database>, e.g. postgres
#   DB_PASSWORD = the database role password
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=never

# ---- HikariCP connection pool ----
# Sized for the Supabase Session Pooler hard cap of 15 clients (EMAXCONNSESSION).
# maximum-pool-size must stay well below 15; override via env without code changes.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.sql.init.mode=never

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY_32_CHARS_MIN}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ---- Google OAuth (real Google login; values come from environment variables) ----
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ---- Firebase (Google sign-in ID-token verification; project id only, no secrets) ----
app.firebase.project-id=${FIREBASE_PROJECT_ID:bodhix-b82fd}

# ---- Email (report sending; credentials come from environment variables) ----
# Transport provider: "smtp" (local dev, default) or "resend" (production HTTPS API).
# Render Free blocks outbound SMTP on ports 25/465/587, so use "resend" there.
email.provider=${EMAIL_PROVIDER:smtp}

# SMTP settings (used when email.provider=smtp)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:}

# Resend HTTPS API settings (used when email.provider=resend)
# Get your API key at https://resend.com/api-keys (starts with re_)
# For the "from" address, use a verified sender or onboarding@resend.dev for testing
RESEND_API_KEY=${RESEND_API_KEY:}
RESEND_FROM=${RESEND_FROM:}

server.port=${PORT:8081}
server.address=0.0.0.0
server.error.include-message=never
server.error.include-stacktrace=never
